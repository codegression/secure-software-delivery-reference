<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="930" viewBox="0 0 1320 930" role="img" aria-labelledby="title description"><title id="title">Mosslight Fieldbook botanical workspace preview</title><desc id="description">Illustrative vector preview of the fictional conservation permit dashboard. Fern Coast has three pending, two approved and one rejected proposal. The selected fern observation is waiting for an independent reviewer.</desc><rect width="1320" height="930" fill="#f4f2e9"/><circle cx="80" cy="63" r="28" fill="none" stroke="#96aa87"/><text x="58" y="79" font-family="Georgia" font-size="45" font-style="italic" letter-spacing="-5" fill="#173c30">m.</text><text x="126" y="56" font-family="Arial" font-size="16" font-weight="bold" letter-spacing="3" fill="#173c30">MOSSLIGHT</text><text x="126" y="77" font-family="Arial" font-size="9" letter-spacing="2" fill="#687b60">CONSERVATION · FIELDBOOK</text><text x="724" y="67" font-family="Georgia" font-size="18" font-style="italic" fill="#758167">A considered approach to fieldwork.</text><text x="1140" y="67" font-family="Arial" font-size="12" fill="#173c30">Mira Reed</text><path d="M52 110H1268" stroke="#d2dac9"/><text x="52" y="162" font-family="Arial" font-size="10" font-weight="bold" letter-spacing="2" fill="#6a7d5e">FERN COAST / REVIEWER</text><text x="52" y="218" font-family="Georgia" font-size="47" letter-spacing="-1" fill="#173c30">The fieldwork desk.</text><text x="52" y="251" font-family="Arial" font-size="14" fill="#68786b">Every collection begins with a considered decision.</text><rect x="1080" y="190" width="188" height="44" rx="3" fill="#173c30"/><text x="1098" y="217" font-family="Arial" font-size="12" fill="#fffef8">+ Propose fieldwork</text><path d="M52 287H1268M52 427H1268M346 287V427M626 287V427M916 287V427" stroke="#d2dac9"/><g font-family="Arial" font-size="11" fill="#68786b"><text x="52" y="321">Awaiting consideration</text><text x="374" y="321">Ready for the field</text><text x="654" y="321">Alternative requested</text><text x="52" y="402">A second pair of eyes</text><text x="374" y="402">Approved with care</text><text x="654" y="402">A lighter approach</text></g><g font-family="Georgia" font-size="48" fill="#173c30"><text x="52" y="377">03</text><text x="374" y="377">02</text><text x="654" y="377">01</text></g><g transform="translate(913 280) scale(.55)" stroke="#718563" fill="none" stroke-width="2"><path d="M68 249C106 197 113 116 208 15"/><path d="M95 200Q45 208 18 178Q73 171 99 187M99 184Q156 202 185 164Q128 162 104 171M108 161Q55 171 34 140Q85 138 115 148M119 138Q169 156 199 123Q156 119 128 126M132 120Q85 122 69 94Q112 93 140 110M147 98Q192 108 215 81Q180 77 157 87M159 79Q122 82 113 56Q143 56 169 68M176 58Q211 66 229 45Q205 43 184 49M190 40Q161 40 163 23Q181 24 198 32M201 26Q219 29 232 12Q216 12 208 17"/></g><text x="1063" y="345" font-family="Georgia" font-size="20" fill="#173c30">Collect knowledge.</text><text x="1063" y="373" font-family="Georgia" font-size="20" font-style="italic" fill="#68786b">Leave room for life.</text><text x="52" y="479" font-family="Georgia" font-size="28" fill="#173c30">Field proposals</text><text x="586" y="479" font-family="Arial" font-size="9" letter-spacing="1.5" fill="#68786b">6 VISIBLE RECORDS</text><rect x="52" y="503" width="50" height="29" rx="3" fill="#173c30"/><text x="68" y="522" font-family="Arial" font-size="11" fill="#fffef8">All</text><g font-family="Arial" font-size="11" fill="#68786b"><text x="122" y="522">Pending</text><text x="207" y="522">Approved</text><text x="305" y="522">Rejected</text></g><rect x="52" y="548" width="652" height="38" rx="3" fill="none" stroke="#d2dac9"/><text x="66" y="572" font-family="Arial" font-size="12" fill="#829078">Find a specimen or plot…</text><rect x="52" y="600" width="652" height="92" fill="#e5ebda"/><text x="67" y="622" font-family="Arial" font-size="9" letter-spacing="1" fill="#68786b">FIELD / 101</text><text x="67" y="649" font-family="Georgia" font-size=