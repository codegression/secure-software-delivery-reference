<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="700" viewBox="0 0 1320 700" role="img" aria-labelledby="title desc"><title id="title">Mosslight Fieldbook security architecture</title><desc id="desc">A browser crosses an untrusted HTTP boundary into origin, body and session controls. Tenant and independent review rules guard parameterized SQLite transactions. Successful decisions and audit records commit together. CI separately produces a tested source artifact.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#57764e" stroke-width="1.5"/></marker></defs><rect width="1320" height="700" rx="8" fill="#f4f2e9"/><text x="52" y="55" font-family="Arial" font-size="12" letter-spacing="3" fill="#65775c">MOSSLIGHT / ENGINEERING NOTE 01</text><text x="52" y="108" font-family="Georgia" font-size="39" fill="#173c30">The decision has a boundary.</text><text x="52" y="144" font-family="Arial" font-size="15" fill="#647468">Identity, team and independent review remain server decisions.</text><rect x="290" y="190" width="974" height="306" rx="8" fill="#e9edde" stroke="#a8b89c" stroke-dasharray="6 6"/><text x="314" y="217" font-family="Arial" font-size="11" letter-spacing="2" fill="#617558">LOOPBACK APPLICATION · TRUSTED PROCESS / LOCAL FILESYSTEM</text><g fill="#fffef8" stroke="#c4ceb9"><rect x="52" y="263" width="190" height="176" rx="5"/><rect x="328" y="248" width="237" height="205" rx="5"/><rect x="615" y="248" width="271" height="205" rx="5"/><rect x="936" y="248" width="290" height="205" rx="5"/></g><g font-family="Georgia" font-size="22" fill="#173c30"><text x="73" y="302">Fieldwork desk</text><text x="350" y="289">Request controls</text><text x="638" y="289">Workflow policy</text><text x="960" y="289">Atomic record</text></g><g font-family="Arial" font-size="13" fill="#586e55"><text x="74" y="332">Untrusted browser input</text><text x="74" y="356">Cookie + CSRF header</text><text x="74" y="380">Text-only DOM output</text><text x="74" y="404">Strict browser CSP</text><text x="350" y="323">01 / Exact Host + Origin</text><text x="350" y="349">02 / JSON + body bounds</text><text x="350" y="375">03 / Session + CSRF</text><text x="350" y="401">04 / Login / write limits</text><text x="638" y="323">Tenant-scoped object lookup</text><text x="638" y="349">Role AND different owner</text><text x="638" y="375">Pending-only state transition</text><text x="638" y="401">Identity set by the server</text><text x="960" y="323">SQLite / parameterized SQL</text><text x="960" y="349">Permit decision + audit</text><text x="960" y="375">One transaction, one winner</text><text x="960" y="401">Hashed session identifiers</text></g><g stroke="#57764e" stroke-width="2" marker-end="url(#arrow)"><path d="M243 351H317"/><path d="M566 351H604"/><path d="M887 351H925"/></g><text x="53" y="242" font-family="Arial" font-size="10" fill="#8c6d46" letter-spacing="1">UNTRUSTED INPUT</text><rect x="52" y="534" width="1212" height="112" rx="5" fill="#173c30"/><text x="76" y="568" font-family="Arial" font-size="10" letter-spacing="2" fill="#cbd8b6">SOURCE DELIVERY / A SEPARATE TRUST PATH</text><text x="76" y="610" font-family="Georgia" font-size="20" fill="#f3f1e8">Immutable action pins</text><text x="339" y="610" font-family="Georgia" font-size="20" fill="#f3f1e8">HTTP negative tests</text><text x="613" y="610" font-family="Georgia" font-size="20" fill="#f3f1e8">Policy + evidence gates</text><text x="932" y="610" font-family="Georgia" font-size="20" fill="#f3f1e8">Source ZIP + digest</text><text x="52" y="675" font-family="Arial" font-size="11" fill="#718069">LAB BOUNDARY: no TLS, public hosting, immutable audit sink or production assurance. Diagram describes implemented flow, not certification.</text></svg>
